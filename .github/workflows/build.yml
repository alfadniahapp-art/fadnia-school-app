name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate missing Flutter Android files
        run: |
          cd /tmp
          flutter create --org com.example --project-name fadnia_school_app temp_app
          cp -rn /tmp/temp_app/android/gradle /home/runner/work/fadnia-school-app/fadnia-school-app/android/ || true
          cp -n /tmp/temp_app/android/gradlew /home/runner/work/fadnia-school-app/fadnia-school-app/android/ || true
          cp -n /tmp/temp_app/android/gradlew.bat /home/runner/work/fadnia-school-app/fadnia-school-app/android/ || true
          cp -rn /tmp/temp_app/android/gradle /home/runner/work/fadnia-school-app/fadnia-school-app/android/ || true
          mkdir -p /home/runner/work/fadnia-school-app/fadnia-school-app/android/app/src/main/res/values
          mkdir -p /home/runner/work/fadnia-school-app/fadnia-school-app/android/app/src/main/res/mipmap-hdpi
          mkdir -p /home/runner/work/fadnia-school-app/fadnia-school-app/android/app/src/main/kotlin/com/example/fadnia_school_app
          cp -n /tmp/temp_app/android/app/src/main/res/values/styles.xml /home/runner/work/fadnia-school-app/fadnia-school-app/android/app/src/main/res/values/ || true
          cp -rn /tmp/temp_app/android/app/src/main/res/mipmap-hdpi/* /home/runner/work/fadnia-school-app/fadnia-school-app/android/app/src/main/res/mipmap-hdpi/ || true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK (ARM64)
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload APK (ARMv7)
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-release
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
