name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate full Flutter Android project
        run: |
          cd /tmp
          flutter create --org com.example --project-name fadnia_school_app temp_app

          # نسخ مجلد android كاملاً واستبدال الموجود
          rm -rf $GITHUB_WORKSPACE/android
          cp -r /tmp/temp_app/android $GITHUB_WORKSPACE/android

          # إعادة اسم الحزمة الأصلية
          find $GITHUB_WORKSPACE/android -type f \( -name "*.gradle" -o -name "*.kts" -o -name "AndroidManifest.xml" -o -name "*.kt" \) -exec sed -i 's/com\.example\.fadnia_school_app/com.example.fadnia_school_app/g' {} +

          # تأكد من أن MainActivity موجودة
          mkdir -p $GITHUB_WORKSPACE/android/app/src/main/kotlin/com/example/fadnia_school_app
          if [ ! -f "$GITHUB_WORKSPACE/android/app/src/main/kotlin/com/example/fadnia_school_app/MainActivity.kt" ]; then
            cat > $GITHUB_WORKSPACE/android/app/src/main/kotlin/com/example/fadnia_school_app/MainActivity.kt << 'EOF'
          package com.example.fadnia_school_app

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity()
          EOF
          fi

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK (ARM64)
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload APK (ARMv7)
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-release
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
