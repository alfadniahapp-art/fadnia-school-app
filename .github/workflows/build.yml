name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate full Flutter Android project
        run: |
          cd /tmp
          flutter create --org com.example --project-name fadnia_school_app temp_app

          rm -rf $GITHUB_WORKSPACE/android
          cp -r /tmp/temp_app/android $GITHUB_WORKSPACE/android

          cat > $GITHUB_WORKSPACE/android/settings.gradle << 'EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.1.0" apply false
              id "org.jetbrains.kotlin.android" version "1.9.10" apply false
          }

          include ":app"
          EOF

          cat > $GITHUB_WORKSPACE/android/build.gradle << 'EOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = "../build"
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(":app")
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

          mkdir -p $GITHUB_WORKSPACE/android/app/src/main/kotlin/com/example/fadnia_school_app
          cat > $GITHUB_WORKSPACE/android/app/src/main/kotlin/com/example/fadnia_school_app/MainActivity.kt << 'EOF'
          package com.example.fadnia_school_app

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity()
          EOF

          # تعديل AndroidManifest.xml
          cd $GITHUB_WORKSPACE
          python3 << 'PYEOF'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()
          content = re.sub(r'android:label="[^"]*"', 'android:label="مدارس الفادنية شرق"', content)
          if 'android:supportsRtl' not in content:
              content = content.replace(
                  '<application',
                  '<application\n        android:supportsRtl="true"'
              )
          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          print("✅ تم تحديث AndroidManifest.xml")
          PYEOF

          echo "=== AndroidManifest.xml (أول 30 سطر) ==="
          head -30 android/app/src/main/AndroidManifest.xml

      - name: Update Gradle wrapper to 8.0
        run: |
          cat > $GITHUB_WORKSPACE/android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-all.zip
          EOF

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK (ARM64)
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload APK (ARMv7)
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-release
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
